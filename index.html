function startFocus(mode,title,minutes,link,linkLabel){
 focusState={mode,title,targetMinutes:minutes,link,linkLabel,start:Date.now(),pausedAt:0,pausedTotal:0,running:true};

}
function elapsedMs(){if(!focusState)return 0;const end=focusState.pausedAt||Date.now();return Math.max(0,end-focusState.start-focusState.pausedTotal)}
function renderFocusRun(){
 open(`<div class="focusRun"><button class="focusClose" data-focusminimize>⌄</button><div class="focusOrb">◎</div><span class="focusKicker">${focusState.mode==='countdown'?'COUNTDOWN':'COUNT UP'}</span><h2>${esc(focusState.title)}</h2><div id="focusClock" class="focusClock">00:00</div>${focusState.linkLabel?`<div class="focusLink">${esc(focusState.linkLabel)}</div>`:''}<div class="focusControls"><button data-focuspause>暂停</button><button class="finish" data-focusfinish>结束</button></div></div>`);updateFocusClock();
}
function updateFocusClock(){
 if(!focusState)return;const elapsed=Math.floor(elapsedMs()/1000);let sec=focusState.mode==='countdown'?Math.max(0,focusState.targetMinutes*60-elapsed):elapsed,el=document.querySelector('#focusClock');if(el)el.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(focusState.mode==='countdown'&&sec<=0&&focusState.running)finishFocus(true);
}
function pauseFocus(){
 if(!focusState)return;if(focusState.pausedAt){focusState.pausedTotal+=Date.now()-focusState.pausedAt;focusState.pausedAt=0;focusState.running=true}else{focusState.pausedAt=Date.now();focusState.running=false}renderFocusRun();const b=document.querySelector('[data-focuspause]');if(b)b.textContent=focusState.pausedAt?'继续':'暂停';
}

}
