<h1>My Life OS · Fresh Start</h1>
<p>新建 GitHub 仓库后，把这个文件夹里的 7 个文件全部上传到仓库根目录，不要再套一层文件夹。</p>
<p>GitHub Pages 设置：<code>Settings → Pages → Deploy from a branch → main → /(root) → Save</code>。</p>
<p>发布后用 Safari 打开网站，再选择“添加到主屏幕”。</p>
<p><b>重要：</b>以后更新时优先替换 index.html；sw.js 使用 network-first，联网时会优先获取最新版。</p>
